name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values so the env-guard (src/lib/env.ts) passes at import time
      # during `next build`. No live DB connection is made at build time —
      # test:int (real Dockerized Postgres) is out of scope for this workflow.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      SESSION_PASSWORD: ci_dummy_session_password_at_least_32_chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
